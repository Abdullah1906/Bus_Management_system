name: Deploy .NET App to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    # ✅ ডিরেক্টরি structure দেখুন
    - name: Debug Directory Structure
      run: |
        echo "Current directory: $(pwd)"
        echo "Files in root:"
        ls -la
        echo "Searching for .sln files:"
        find . -name "*.sln"
        echo "Searching for .csproj files:"
        find . -name "*.csproj"

    # ✅ সঠিক path এ restore করুন
    - name: Restore dependencies
      run: |
        if [ -f "Bus Pos Solution.sln" ]; then
          dotnet restore "Bus Pos Solution.sln"
        elif [ -f "Bus_Pos_Solution.sln" ]; then
          dotnet restore "Bus_Pos_Solution.sln"
        elif [ -f "BusPosSolution.sln" ]; then
          dotnet restore "BusPosSolution.sln"
        else
          echo "Searching for sln file..."
          SLN_FILE=$(find . -name "*.sln" | head -1)
          if [ -n "$SLN_FILE" ]; then
            echo "Found: $SLN_FILE"
            dotnet restore "$SLN_FILE"
          else
            echo "No sln file found!"
            exit 1
          fi
        fi

    - name: Build Project
      run: |
        SLN_FILE=$(find . -name "*.sln" | head -1)
        dotnet build "$SLN_FILE" --configuration Release --no-restore

    - name: Publish API
      run: |
        # API project খুঁজে বের করুন
        API_PROJECT=$(find . -path "*/bps.api/*.csproj" | head -1)
        if [ -z "$API_PROJECT" ]; then
          echo "API project not found! Searching for any csproj..."
          API_PROJECT=$(find . -name "*.csproj" | grep -i "api" | head -1)
        fi
        if [ -z "$API_PROJECT" ]; then
          echo "No API project found!"
          echo "Available csproj files:"
          find . -name "*.csproj"
          exit 1
        fi
        
        echo "Publishing: $API_PROJECT"
        dotnet publish "$API_PROJECT" -c Release -o ./publish --no-build
        
        echo "Publish completed. Files in publish folder:"
        ls -la ./publish/

    - name: List published files (Debug)
      run: |
        echo "Current directory: $(pwd)"
        echo "Files in publish folder:"
        ls -la ./publish/ || echo "Publish folder not found!"
        echo "Total files: $(find ./publish -type f | wc -l)"

    - name: List published files
      run: ls -la ./publish/

    - name: Deploy to EC2 via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        port: ${{ secrets.EC2_PORT || 22 }}
        script: |
          set -e
          
          echo "🚀 Starting deployment to EC2..."
          echo "==================================="
          
          # Check if publish folder exists in GitHub workspace
          echo "🔍 Checking publish folder in GitHub workspace..."
          if [ -d "/github/workspace/publish" ]; then
            echo "✅ Publish folder found"
            echo "📂 Files to deploy:"
            ls -la /github/workspace/publish/ | head -20
          else
            echo "❌ Publish folder not found at /github/workspace/publish/"
            echo "📂 Available folders:"
            ls -la /github/workspace/
            exit 1
          fi
          
          # Backup current deployment
          echo "📦 Creating backup..."
          sudo rm -rf /var/www/buspos_backup
          if [ -d "/var/www/buspos" ]; then
            sudo cp -r /var/www/buspos /var/www/buspos_backup
            echo "✅ Backup created at /var/www/buspos_backup"
          else
            echo "ℹ️ No existing deployment found, skipping backup"
          fi
          
          # Create directory with proper permissions
          echo "📁 Creating deployment directory..."
          sudo mkdir -p /var/www/buspos
          sudo chown -R $USER:$USER /var/www/buspos
          sudo chmod -R 755 /var/www/buspos
          echo "✅ Directory created"
          
          # Remove old files
          echo "🗑️ Removing old files..."
          sudo rm -rf /var/www/buspos/*
          
          # Copy new files from GitHub workspace
          echo "📂 Copying new files..."
          sudo cp -r /github/workspace/publish/* /var/www/buspos/
          echo "✅ Files copied successfully"
          
          # Set proper permissions
          echo "🔧 Setting permissions..."
          sudo chown -R $USER:$USER /var/www/buspos
          sudo chmod -R 755 /var/www/buspos
          echo "✅ Permissions set"
          
          # Verify deployed files
          echo "📋 Deployed files (first 20):"
          ls -la /var/www/buspos/ | head -20
          echo "📊 Total deployed files: $(find /var/www/buspos -type f | wc -l)"
          
          # Check if service exists, if not create it
          echo "🔄 Checking service status..."
          if systemctl list-units --full -all | grep -q "buspos.service"; then
            echo "✅ buspos.service already exists"
          else
            echo "⚠️ buspos.service not found. Creating service..."
            
            # Create service file
            sudo tee /etc/systemd/system/buspos.service > /dev/null <<'EOF'
          [Unit]
          Description=Bus POS Application
          After=network.target
          
          [Service]
          WorkingDirectory=/var/www/buspos
          ExecStart=/usr/bin/dotnet /var/www/buspos/BPS.API.dll --urls="http://0.0.0.0:5000"
          Restart=always
          RestartSec=10
          User=ubuntu
          Environment=ASPNETCORE_ENVIRONMENT=Production
          
          [Install]
          WantedBy=multi-user.target
          EOF
            
            echo "✅ Service file created at /etc/systemd/system/buspos.service"
            
            # Reload systemd
            sudo systemctl daemon-reload
            echo "✅ Systemd reloaded"
            
            # Enable service
            sudo systemctl enable buspos.service
            echo "✅ Service enabled"
          fi
          
          # Restart service
          echo "🔄 Restarting service..."
          sudo systemctl daemon-reload
          sudo systemctl restart buspos.service
          echo "✅ Service restarted"
          
          # Check service status
          echo "📊 Service status:"
          sudo systemctl status buspos.service --no-pager || echo "⚠️ Service status check failed"
          
          # Check if application is running
          echo "🔍 Checking if application is running..."
          sleep 5
          if pgrep -f "dotnet.*BPS.API.dll" > /dev/null; then
            echo "✅ Application is running"
            ps aux | grep "dotnet.*BPS.API.dll" | grep -v grep
          else
            echo "⚠️ Application not running. Checking logs..."
            sudo journalctl -u buspos.service -n 20 --no-pager
          fi
          
          echo "==================================="
          echo "🎉 Deployment completed successfully!"
          
          echo ""
          echo "📌 Application Information:"
          echo "   - Location: /var/www/buspos"
          echo "   - Service: buspos.service"
          echo "   - Port: 5000"
          echo "   - URL: http://${{ secrets.EC2_HOST }}:5000"

    - name: Health Check
      run: |
        echo "⏳ Waiting for application to start..."
        sleep 10
        
        echo "🔍 Performing health check..."
        echo "🌐 URL: http://${{ secrets.EC2_HOST }}:5000"
        
        if curl -f -s -o /dev/null http://${{ secrets.EC2_HOST }}:5000/health; then
          echo "✅ Health check passed!"
          echo "✅ Application is running at: http://${{ secrets.EC2_HOST }}:5000"
        else
          echo "⚠️ Health check endpoint not responding"
          echo "ℹ️ Trying to access root endpoint..."
          if curl -f -s -o /dev/null http://${{ secrets.EC2_HOST }}:5000; then
            echo "✅ Application is running (root endpoint)"
          else
            echo "❌ Application not responding."
            echo "🔍 Please check EC2 logs:"
            echo "   sudo journalctl -u buspos.service -f"
          fi
        fi

    - name: Deployment Summary
      run: |
        echo "==================================="
        echo "✅ DEPLOYMENT SUMMARY"
        echo "==================================="
        echo "🌐 Application URL: http://${{ secrets.EC2_HOST }}:5000"
        echo "📁 Deployment Path: /var/www/buspos"
        echo "🔄 Service Name: buspos.service"
        echo "📊 Check Status: sudo systemctl status buspos.service"
        echo "📋 View Logs: sudo journalctl -u buspos.service -f"
        echo "==================================="