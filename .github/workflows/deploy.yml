name: Deploy .NET App to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    # ✅ ডিরেক্টরি structure দেখুন
    - name: Debug Directory Structure
      run: |
        echo "Current directory: $(pwd)"
        echo "Files in root:"
        ls -la
        echo "Searching for .sln files:"
        find . -name "*.sln"
        echo "Searching for .csproj files:"
        find . -name "*.csproj"

    # ✅ সঠিক path এ restore করুন
    - name: Restore dependencies
      run: |
        if [ -f "Bus Pos Solution.sln" ]; then
          dotnet restore "Bus Pos Solution.sln"
        elif [ -f "Bus_Pos_Solution.sln" ]; then
          dotnet restore "Bus_Pos_Solution.sln"
        elif [ -f "BusPosSolution.sln" ]; then
          dotnet restore "BusPosSolution.sln"
        else
          echo "Searching for sln file..."
          SLN_FILE=$(find . -name "*.sln" | head -1)
          if [ -n "$SLN_FILE" ]; then
            echo "Found: $SLN_FILE"
            dotnet restore "$SLN_FILE"
          else
            echo "No sln file found!"
            exit 1
          fi
        fi

    - name: Build Project
      run: |
        SLN_FILE=$(find . -name "*.sln" | head -1)
        dotnet build "$SLN_FILE" --configuration Release --no-restore

    - name: Publish API
      run: |
        # API project খুঁজে বের করুন
        API_PROJECT=$(find . -path "*/bps.api/*.csproj" | head -1)
        if [ -z "$API_PROJECT" ]; then
          echo "API project not found! Searching for any csproj..."
          API_PROJECT=$(find . -name "*.csproj" | grep -i "api" | head -1)
        fi
        if [ -z "$API_PROJECT" ]; then
          echo "No API project found!"
          echo "Available csproj files:"
          find . -name "*.csproj"
          exit 1
        fi
        
        echo "Publishing: $API_PROJECT"
        dotnet publish "$API_PROJECT" -c Release -o ./publish --no-build
        
        echo "Publish completed."

    - name: List published files (Debug)
      run: |
        echo "Current directory: $(pwd)"
        echo "Files in publish folder:"
        ls -la ./publish/ || echo "Publish folder not found!"
        echo "Total files: $(find ./publish -type f | wc -l)"

    - name: Create deployment package
      run: |
        cd publish
        tar -czf ../deploy.tar.gz .
        cd ..
        echo "✅ Package created: deploy.tar.gz"

    # ✅ Tar file home তে পাঠান
    - name: Upload package to EC2
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        port: ${{ secrets.EC2_PORT || 22 }}
        source: "deploy.tar.gz"
        target: "/home/${{ secrets.EC2_USERNAME }}/"
        debug: true

    # ✅ EC2-তে .NET Runtime Install করুন
    - name: Install .NET Runtime on EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        port: ${{ secrets.EC2_PORT || 22 }}
        script: |
          echo "🔍 Checking .NET Runtime..."
          
          # Check if dotnet is already installed
          if command -v dotnet &> /dev/null; then
            echo "✅ .NET Runtime already installed: $(dotnet --version)"
          else
            echo "📥 Installing .NET 8.0 Runtime..."
            
            # Detect Ubuntu version
            UBUNTU_VERSION=$(lsb_release -rs | cut -d. -f1)
            echo "Ubuntu version: $UBUNTU_VERSION"
            
            # Install based on version
            if [ "$UBUNTU_VERSION" == "24" ]; then
              wget https://packages.microsoft.com/config/ubuntu/24.04/packages-microsoft-prod.deb -O packages-microsoft-prod.deb
            elif [ "$UBUNTU_VERSION" == "22" ]; then
              wget https://packages.microsoft.com/config/ubuntu/22.04/packages-microsoft-prod.deb -O packages-microsoft-prod.deb
            elif [ "$UBUNTU_VERSION" == "20" ]; then
              wget https://packages.microsoft.com/config/ubuntu/20.04/packages-microsoft-prod.deb -O packages-microsoft-prod.deb
            else
              echo "❌ Unsupported Ubuntu version: $UBUNTU_VERSION"
              exit 1
            fi
            
            sudo dpkg -i packages-microsoft-prod.deb
            rm packages-microsoft-prod.deb
            sudo apt-get update
            sudo apt-get install -y dotnet-runtime-8.0
            
            echo "✅ .NET Runtime installed successfully!"
            
          fi

    # ✅ SSH দিয়ে Extract এবং Service ফোর্সড আপডেট
    - name: Extract and setup on EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        port: ${{ secrets.EC2_PORT || 22 }}
        script: |
          echo "📦 Extracting deployment package..."
          
          # Create directory
          sudo mkdir -p /var/www/buspos
          sudo chown -R $USER:$USER /var/www/buspos
          
          # Extract files
          sudo tar -xzf /home/$USER/deploy.tar.gz -C /var/www/buspos/
          
          # Remove tar file
          rm -f /home/$USER/deploy.tar.gz
          
          # Set permissions
          sudo chown -R $USER:$USER /var/www/buspos
          sudo chmod -R 755 /var/www/buspos
          
          echo "📂 Deployed files:"
          ls -la /var/www/buspos/ | head -20
          
          # ✅ Service ফাইল ফোর্সড আপডেট (if বাদ দিন)
          echo "🔄 Setting up service..."
          
          # পুরনো service stop করুন
          sudo systemctl stop buspos.service 2>/dev/null || true
          sudo systemctl disable buspos.service 2>/dev/null || true
          
          # Service ফাইল ওভাররাইট করুন
          sudo tee /etc/systemd/system/buspos.service > /dev/null <<'EOF'
          [Unit]
          Description=Bus POS Application
          After=network.target
          
          [Service]
          WorkingDirectory=/var/www/buspos
          ExecStart=/usr/share/dotnet/dotnet /var/www/buspos/BPS.API.dll --urls="http://0.0.0.0:5000"
          Restart=always
          RestartSec=10
          User=ubuntu
          Environment=ASPNETCORE_ENVIRONMENT=Production
          Environment=DOTNET_ROOT=/usr/share/dotnet
          
          [Install]
          WantedBy=multi-user.target
          EOF
          
          sudo systemctl daemon-reload
          sudo systemctl enable buspos.service
          
          echo "🔄 Restarting service..."
          sudo systemctl restart buspos.service
          
          sleep 3
          
          echo "📊 Service status:"
          sudo systemctl status buspos.service --no-pager
          
          echo "📋 Checking logs:"
          sudo journalctl -u buspos.service -n 20 --no-pager
          
          echo "✅ Deployment complete!"