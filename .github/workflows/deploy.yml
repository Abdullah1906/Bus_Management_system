name: Deploy .NET App to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Build and Publish
      run: |
        cd "Bus Pos Solution"
        dotnet restore
        dotnet build --configuration Release --no-restore
        cd bps.api
        dotnet publish -c Release -o ../../publish --no-build
        cd ../..
        echo "✅ Build complete"

    - name: Create deployment package
      run: |
        cd publish
        tar -czf ../deploy.tar.gz .
        cd ..
        echo "✅ Package created: deploy.tar.gz"

    # ✅ Tar file home তে পাঠান
    - name: Upload package to EC2
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        port: ${{ secrets.EC2_PORT || 22 }}
        source: "deploy.tar.gz"
        target: "/home/${{ secrets.EC2_USERNAME }}/"
        debug: true

    # ✅ SSH দিয়ে Extract করুন
    - name: Extract and setup on EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        port: ${{ secrets.EC2_PORT || 22 }}
        script: |
          echo "📦 Extracting deployment package..."
          
          # Create directory
          sudo mkdir -p /var/www/buspos
          sudo chown -R $USER:$USER /var/www/buspos
          
          # Extract files
          sudo tar -xzf /home/$USER/deploy.tar.gz -C /var/www/buspos/
          
          # Remove tar file
          rm -f /home/$USER/deploy.tar.gz
          
          # Set permissions
          sudo chown -R $USER:$USER /var/www/buspos
          sudo chmod -R 755 /var/www/buspos
          
          echo "📂 Deployed files:"
          ls -la /var/www/buspos/ | head -20
          
          echo "🔄 Setting up service..."
          if ! systemctl list-units --full -all | grep -q "buspos.service"; then
            sudo tee /etc/systemd/system/buspos.service > /dev/null <<'EOF'
          [Unit]
          Description=Bus POS Application
          After=network.target
          
          [Service]
          WorkingDirectory=/var/www/buspos
          ExecStart=/usr/bin/dotnet /var/www/buspos/BPS.API.dll --urls="http://0.0.0.0:5000"
          Restart=always
          RestartSec=10
          User=ubuntu
          Environment=ASPNETCORE_ENVIRONMENT=Production
          
          [Install]
          WantedBy=multi-user.target
          EOF
            sudo systemctl daemon-reload
            sudo systemctl enable buspos.service
          fi
          
          echo "🔄 Restarting service..."
          sudo systemctl restart buspos.service
          
          echo "📊 Service status:"
          sudo systemctl status buspos.service --no-pager
          
          echo "✅ Deployment complete!"