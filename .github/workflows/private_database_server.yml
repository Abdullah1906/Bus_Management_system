name: Fetch BPS.bak via Bastion
 
on:
  workflow_dispatch:
 
jobs:
  fetch-database-backup:
    runs-on: ubuntu-latest
 
    steps:
      - name: Save pem key (exact same file used manually)
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > abd_bs_ubuntu.pem
          chmod 400 abd_bs_ubuntu.pem
 
      - name: SSH bastion -> private server -> clone repo -> copy BPS.bak
        run: |
          ssh -o StrictHostKeyChecking=no -i ./abd_bs_ubuntu.pem \
            ubuntu@${{ secrets.EC2_HOST }} \
            "ssh -o StrictHostKeyChecking=no -i ~/.ssh/abd_bs_ubuntu.pem ubuntu@${{ vars.PRIVATE_HOST }} '
              echo \"===> 1. Cloning Repo & Copying BPS.bak <===\"
              rm -rf Bus_Management_system &&
              git clone https://github.com/Abdullah1906/Bus_Management_system.git &&
              cd Bus_Management_system && 
              cp \"Bus Pos Solution/Database/BPS.bak\" /home/ubuntu/BPS.bak &&
              echo COPIED_OK
            
              echo \"===> 2. System Update & Installing Prerequisites <===\"
              sudo apt update && sudo apt upgrade -y
              sudo apt install -y curl gnupg2 software-properties-common

              echo \"===> 3. Adding Microsoft Repository Keys <===\"
              curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/microsoft.gpg
              curl -fsSL https://packages.microsoft.com/config/ubuntu/22.04/mssql-server-2022.list | sudo tee /etc/apt/sources.list.d/mssql-server-2022.list

              echo \"===> 4. Installing MSSQL Server 2022 <===\"
              sudo apt update
              sudo apt install -y mssql-server

              echo \"===> 5. Configuring MSSQL Non-Interactively <===\"
              sudo MSSQL_SA_PASSWORD=\"${{ secrets.DB_PASSWORD }}\" \
                   MSSQL_PID=\"Express\" \
                   ACCEPT_EULA=\"Y\" \
                   MSSQL_LCID=1033 \
                   /opt/mssql/bin/mssql-conf -n setup

              echo \"===> 6. Installing MSSQL Tools 18 <===\"
              curl -fsSL https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/msprod.list
              sudo apt update
              sudo ACCEPT_EULA=Y apt install -y mssql-tools18 unixodbc-dev

              echo \"===> 7. Setting Environment PATH <===\"
              echo '\''export PATH=\"\$PATH:/opt/mssql-tools18/bin\"'\'' >> ~/.bashrc
              export PATH=\"\$PATH:/opt/mssql-tools18/bin\"

              echo \"===> 8. Fixing Missing Dependencies (libldap) <===\"
              cd /tmp
              wget -q http://archive.ubuntu.com/ubuntu/pool/main/o/openldap/libldap-2.5-0_2.5.20+dfsg-0ubuntu0.22.04.1_amd64.deb
              sudo apt-get install -y ./libldap-2.5-0_2.5.20+dfsg-0ubuntu0.22.04.1_amd64.deb

              echo \"===> 9. Checking Missing Dynamic Libraries <===\"
              ldd /opt/mssql/bin/sqlservr | grep \"not found\" || echo \"No missing libraries!\"

              echo \"===> 10. Resetting Service & Starting MSSQL <===\"
              sudo systemctl reset-failed mssql-server.service
              sudo systemctl enable mssql-server
              sudo systemctl start mssql-server

              echo \"===> 12. Copying BPS.bak & Setting Permissions <===\"
              sudo cp /home/ubuntu/BPS.bak /var/opt/mssql/data/
              sudo chown mssql:mssql /var/opt/mssql/data/BPS.bak

              echo \"===> 14. Restoring Database with Automatic Fallback / Password Reset <===\"
              PASS=\"${{ secrets.DB_PASSWORD }}\"
              
              RESTORE_QUERY=\"RESTORE DATABASE BPS FROM DISK = N'/var/opt/mssql/data/BPS.bak' WITH MOVE N'BPS' TO N'/var/opt/mssql/data/BPS.mdf', MOVE N'BPS_log' TO N'/var/opt/mssql/data/BPS_log.ldf', REPLACE;\"

              if /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"\$PASS\" -C -Q \"\$RESTORE_QUERY\"; then
                  echo \"===> Restore Successful on First Attempt! <===\"
              else
                  echo \"===> Resetting SA Password and Retrying Restore... <===\"
                  sudo systemctl stop mssql-server
                  sudo MSSQL_SA_PASSWORD=\"\$PASS\" /opt/mssql/bin/mssql-conf set-sa-password
                  sudo systemctl start mssql-server
                  
                  # সার্ভিস পুরোপুরি স্টার্ট হওয়া পর্যন্ত ২ সেকেন্ড ওয়েট
                  sleep 2
                  
                  /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"\$PASS\" -C -Q \"\$RESTORE_QUERY\"
              fi

              echo \"===> 15. Verifying Restored Databases <===\"
              /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"\$PASS\" -C -Q \"SELECT name FROM sys.databases;\"

              
            '"