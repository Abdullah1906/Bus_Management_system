name: Fetch BPS.bak via Bastion
 
on:
  workflow_dispatch:
 
jobs:
  fetch-database-backup:
    runs-on: ubuntu-latest
 
    steps:
      - name: Save pem key (exact same file used manually)
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > abd_bs_ubuntu.pem
          chmod 400 abd_bs_ubuntu.pem
 
      - name: SSH bastion -> private server -> clone repo -> copy BPS.bak
        run: |
          ssh -o StrictHostKeyChecking=no -i ./abd_bs_ubuntu.pem \
            ubuntu@${{ secrets.EC2_HOST }} \
            "ssh -o StrictHostKeyChecking=no -i ~/.ssh/abd_bs_ubuntu.pem ubuntu@${{ vars.PRIVATE_HOST }} '
              echo \"===> 1. Cloning Repo & Copying BPS.bak <===\"
              rm -rf Bus_Management_system &&
              git clone https://github.com/Abdullah1906/Bus_Management_system.git &&
              cd Bus_Management_system && 
              cp \"Bus Pos Solution/Database/BPS.bak\" /home/ubuntu/BPS.bak &&
              echo COPIED_OK
            
              echo \"===> 2. System Update & Installing Prerequisites <===\"
              sudo apt update && sudo apt upgrade -y
              sudo apt install -y curl gnupg2 software-properties-common

              echo \"===> 3. Adding Microsoft Repository Keys <===\"
              curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/microsoft.gpg
              curl -fsSL https://packages.microsoft.com/config/ubuntu/22.04/mssql-server-2022.list | sudo tee /etc/apt/sources.list.d/mssql-server-2022.list

              echo \"===> 4. Installing MSSQL Server 2022 <===\"
              sudo apt update
              sudo apt install -y mssql-server
            '"